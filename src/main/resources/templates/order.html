<!DOCTYPE html>
<html lang="ru" class="h-100" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body class="d-flex flex-column h-100">
<div th:replace="~{fragments/navbar}">Navbar</div>
<main class="flex-shrink-0">
  <div class="container">
    <div class="row">
      <div class="col-md-2"></div>
      <main class="jumbotron text-center rounded col-md-12 align-self-center pt-5">
        <div class="justify-content-center">
          <h1>Информация о чае</h1>
        </div>
        <div class="d-flex flex-column bg-text mb-3 p-3 border rounded">
          <h2>Заказ</h2>
          <h2 th:text="'Кому: ' + ${model.fullname}"></h2>
          <h2 th:text="'Цена: ' + ${model.amount}"></h2>
          <h2 th:text="'Дата: ' + ${model.localDateTime}"></h2>
          <h2 th:text="'Куда: ' + ${model.deliveryTo}"></h2>
          <h2 th:text="'Статус: ' + ${model.orderStatus}"></h2>
          <h3 th:text="Чай"></h3>
          <div class="row bg-light rounded" th:each="tea : ${model.teaViewModelList}">
            <h4 th:text="${tea.name}"></h4>
            <h4 th:text="${tea.desc}"></h4>
            <h4 th:text="${tea.sort}"></h4>
            <div class="row bg-light rounded" th:each="ingredient : ${tea.ingredients}">
              <h4 th:text="${ingredient}"></h4>
            </div>
            <h4 th:text="${tea.cost}"></h4>
            <h4 th:text="${tea.availability}"></h4>
            <h4 th:text="${tea.supplier}"></h4>
<!--            <h4 th:text="${tea.hasDiscount}"></h4>-->
          </div>
        </div>
      </main>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/footer}"/>
</body>
</html>
